# robotcar — M2: perception + reasoning + voice brain (movement still off).
#  - Inter-service calls use Compose service DNS (http://<svc>:8000).
#  - Only `brain` publishes a host port, bound to 127.0.0.1 (R7/R9).
#  - Images pinned (R8). ollama-new uses a Jetson-specific image (F1).
#  - ocr/depth are on-demand (profile "ondemand") so they don't sit in the
#    always-on 16GB budget. Start when needed:
#      docker compose --profile ondemand up -d ocr depth
#  - perception (YOLO pure-TRT) is built on-device by Terminal; brain degrades
#    gracefully to the VLM when perception is absent.
name: robotcar

services:
  ollama-new:
    image: dustynv/ollama:0.6.8-r36.4-cu126-22.04
    runtime: nvidia
    command: ["/bin/bash", "-c", "/start_ollama && exec tail -f ${OLLAMA_LOGS:-/data/logs/ollama.log}"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1                          # M41: 無限期保留模型（預熱常駐）
      - OLLAMA_NUM_PARALLEL=1                         # M41: 單線程推理（避免資源競爭）
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama-new:/data
    restart: unless-stopped

  asr:
    build: { context: ., dockerfile: docker/asr/Dockerfile }
    image: robotcar-asr:0.2.0
    runtime: nvidia  # M3-6b：啟用 GPU 加速
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    environment:
      - ASR_ENGINE=${ASR_ENGINE:-sensevoice}      # sensevoice | whisper(fallback)
      - ASR_LANG=${ASR_LANG:-zh}
      - ASR_HOTWORDS=${ASR_HOTWORDS:-JN1,Kokoro,Jetson}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - ASR_DEVICE=${ASR_DEVICE:-auto}             # M3-6b：auto(優先GPU) | cpu | cuda
      - ASR_COMPUTE=${ASR_COMPUTE:-float16}        # M3-6b：float16 快速，int8 節省記憶體
      - PULSE_SERVER=unix:/run/pulse/native
      - PULSE_COOKIE=/run/pulse/cookie
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ${PULSE_SOCKET:-/run/user/1000/pulse/native}:/run/pulse/native
      - ${PULSE_COOKIE_PATH:-/home/jetson/.config/pulse/cookie}:/run/pulse/cookie:ro
      - ./data/asr-models:/models                  # persist SenseVoice/whisper downloads
      - ./data/logs:/data/logs
    restart: unless-stopped

  tts:
    build: { context: ., dockerfile: docker/tts/Dockerfile }
    image: robotcar-tts:latest
    environment:
      - TTS_ENGINE=kokoro
      - KOKORO_VOICE=${KOKORO_VOICE:-zf_xiaobei}
      - PIPER_VOICE=${PIPER_VOICE:-zh_CN-huayan-medium}
      - PULSE_SERVER=unix:/run/pulse/native
      - PULSE_COOKIE=/run/pulse/cookie
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - ${PULSE_SOCKET:-/run/user/1000/pulse/native}:/run/pulse/native
      - ${PULSE_COOKIE_PATH:-/home/jetson/.config/pulse/cookie}:/run/pulse/cookie:ro
      - ./data/logs:/data/logs
    restart: unless-stopped

  perception:
    build: { context: ., dockerfile: docker/perception/Dockerfile }
    image: robotcar-perception:1.0.0
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]
    environment:
      - YOLO_MODEL=${YOLO_MODEL:-yolo11n}
      - CONF_THRESHOLD=${CONF_THRESHOLD:-0.5}
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - FRAME_RATE=${FRAME_RATE:-30}
    ports:
      - "127.0.0.1:8001:8000"
    devices:
      - ${VIDEO_DEV:-/dev/video0}:/dev/video0
    volumes:
      - ./data/logs:/data/logs
    restart: unless-stopped

  vision:
    build: { context: ., dockerfile: docker/vision/Dockerfile }
    image: robotcar-vision:latest
    environment:
      - OLLAMA_URL=http://ollama-new:11434
      - VLM_MODEL=${VLM_MODEL:-moondream}          # M59.6: mode_config.json 讀不到時的備援
      - JN1_MODE_CONFIG_FILE=/appdata/mode_config.json
      - PERCEPTION_URL=${PERCEPTION_URL:-http://perception:8000}
      - VIDEO_DEV=${VIDEO_DEV:-/dev/video0}
    devices:
      - ${VIDEO_DEV:-/dev/video0}:/dev/video0
    volumes:
      - ./data/logs:/data/logs
      # M59.6：唯讀掛整個 data 目錄（比照 M58 對 brain 的做法，同理不能
      # 單掛 mode_config.json——modes.py 存檔用 rename，會換 inode）
      - ./data:/appdata:ro
    depends_on: [ollama-new, perception]
    restart: unless-stopped

  ocr:
    build: { context: ., dockerfile: docker/ocr/Dockerfile }
    image: robotcar-ocr:0.1.0
    profiles: ["ondemand"]
    environment:
      - PERCEPTION_URL=${PERCEPTION_URL:-http://perception:8000}
      - OCR_LANG=${OCR_LANG:-ch}
      - VIDEO_DEV=${VIDEO_DEV:-/dev/video0}
    ports:
      - "127.0.0.1:8002:8000"
    devices:
      - ${VIDEO_DEV:-/dev/video0}:/dev/video0       # only used if perception is down
    volumes:
      - ./data/ocr-models:/models
      - ./data/logs:/data/logs
    restart: unless-stopped

  depth:
    build: { context: ., dockerfile: docker/depth/Dockerfile }
    image: robotcar-depth:0.1.0
    profiles: ["ondemand"]
    runtime: nvidia
    environment:
      - PERCEPTION_URL=${PERCEPTION_URL:-http://perception:8000}
      - DEPTH_MODEL=${DEPTH_MODEL:-depth-anything/Depth-Anything-V2-Small-hf}
      - VIDEO_DEV=${VIDEO_DEV:-/dev/video0}
    devices:
      - ${VIDEO_DEV:-/dev/video0}:/dev/video0
    volumes:
      - ./data/hf:/models/hf
      - ./data/logs:/data/logs
    restart: unless-stopped

  brain:
    build: { context: ., dockerfile: docker/brain/Dockerfile }
    image: robotcar-brain:0.2.0
    environment:
      - OLLAMA_URL=http://ollama-new:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-2048}
      - MEM_TURNS=${MEM_TURNS:-8}
      - ASR_URL=http://asr:8000
      - TTS_URL=http://tts:8000
      - VISION_URL=http://vision:8000
      - PERCEPTION_URL=${PERCEPTION_URL:-http://perception:8000}
      - OCR_URL=http://ocr:8000
      - DEPTH_URL=http://depth:8000
      - LISTEN_SECONDS=${LISTEN_SECONDS:-5}
      - JN1_MODE_FILE=/appdata/mode.json          # M58：五模式狀態（唯讀）
    ports:
      - "127.0.0.1:${BRAIN_PORT:-21500}:8000"
    volumes:
      # M58：唯讀掛整個 data 目錄（不是單掛 mode.json）——modes.py 用
      # rename 做原子寫入會換 inode，單掛檔案會讓容器看不到更新。
      - ./data:/appdata:ro
    depends_on: [ollama-new, asr, tts, vision]
    restart: unless-stopped

  webui:
    build: { context: ., dockerfile: docker/webui/Dockerfile }
    image: robotcar-webui:1.0.0
    environment:
      - BRAIN_URL=http://brain:8000
      - PERCEPTION_URL=http://perception:8000
      - ASR_URL=http://asr:8000
      - TTS_URL=http://tts:8000
      - VISION_URL=http://vision:8000
      - WEBUI_USER=${WEBUI_USER}
      - WEBUI_PASS=${WEBUI_PASS}
    ports:
      - "0.0.0.0:8080:8000"
    depends_on: [brain, perception]
    networks:
      - default
    restart: unless-stopped

  cloud-gw:
    image: robotcar-brain:0.2.0
    working_dir: /app
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - CLOUD_DAILY_LIMIT=45
    volumes:
      - ./src/cloud_gw:/app
    ports:
      - "127.0.0.1:8010:8000"
    restart: unless-stopped
