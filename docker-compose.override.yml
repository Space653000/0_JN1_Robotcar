# Audio cookie fix: in-container paplay/parec read the PulseAudio cookie from
# ~/.config/pulse/cookie (container HOME=/root). Mount the host user's cookie there
# and point PULSE_COOKIE at it (host playback already works; this fixes container->pulse auth).
services:
  tts:
    environment:
      - PULSE_COOKIE=/root/.config/pulse/cookie
    volumes:
      - /home/jetson/.config/pulse/cookie:/root/.config/pulse/cookie:ro
  asr:
    environment:
      - PULSE_COOKIE=/root/.config/pulse/cookie
    volumes:
      - /home/jetson/.config/pulse/cookie:/root/.config/pulse/cookie:ro
